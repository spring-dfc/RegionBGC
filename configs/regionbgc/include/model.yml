# MST: average pooling followed by pointwise projections.
# ISFI: self-attention on the coarsest scale. CSFF: bidirectional scale fusion.
# EMHCA: multi-head cross-attention with relative-position bias.

task: region_prediction
model: RegionBGC
criterion: RegionBGCCriterion
postprocessor: RegionBGCPostProcessor
RegionBGC: {backbone: MultiScalePooling, encoder: MultiScaleRegionFeatureEncoder, decoder: RegionQueryDecoder}
MultiScalePooling: {in_ch: 960, output_strides: [1, 2, 4]}
MultiScaleRegionFeatureEncoder:
  in_channels: [960, 960, 960]
  feat_strides: [1, 2, 4]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.2
  enc_act: gelu
  pe_temperature: 10000
  expansion: 1.0
  depth_mult: 1
  act: silu
RegionQueryDecoder:
  feat_channels: [256, 256, 256]
  feat_strides: [1, 2, 4]
  hidden_dim: 256
  nhead: 8
  num_levels: 3
  cross_attn_type: global
  global_cross_attn_use_reference_bias: true
  global_cross_attn_inside_bias_init: 1.5
  global_cross_attn_distance_scale_init: 2.0
  use_memory_pos_embed: true
  memory_pos_temperature: 10000.0
  num_bgc_types: 6
  num_queries: 64
  eps: 0.01
  num_decoder_layers: 2
  dim_feedforward: 1024
  aux_loss: true
  decoder_aux_loss: true
  encoder_aux_loss: true
  decoder_aux_weight: 1.0
  encoder_aux_weight: 1.0
  decoder_aux_bgc_types_loss: true
  dropout: 0.2
  eval_idx: -1
RegionBGCCriterion:
  det_pos_weight: 1.3
  weight_dict: {loss_ia_bce: 2, loss_interval_l1: 5, loss_giou: 2, loss_bgc_types: 1}
  losses: [ia_bce, intervals, bgc_types]
  alpha: 0.25
  gamma: 2.0
  bgc_alpha: 0.25
  bgc_gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_interval_l1: 5, cost_giou: 2}
    alpha: 0.5
    gamma: 2.0
RegionBGCPostProcessor: {num_top_queries: 300}
