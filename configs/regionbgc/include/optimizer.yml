clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - {params: '^(?=.*encoder(?=.*bias|.*norm.*weight)).*$', weight_decay: 0.0}
  - {params: '^(?=.*decoder(?=.*bias|.*norm.*weight)).*$', weight_decay: 0.0}
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  # Halve the learning rate after completing epoch 16 (one based).
  milestones: [16]
  gamma: 0.5
